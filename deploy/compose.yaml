name: sidey

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sidey
      POSTGRES_USER: sidey
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidey -d sidey"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: sidey
      PGDATABASE: sidey
    secrets:
      - db_password
    volumes:
      - ../migrations:/migrations:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        export PGPASSWORD="$$(cat /run/secrets/db_password)"
        psql -v ON_ERROR_STOP=1 -c 'CREATE TABLE IF NOT EXISTS schema_migrations (name text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())'
        for f in /migrations/*.sql; do
          name="$$(basename "$$f")"
          if psql -tA -c "SELECT 1 FROM schema_migrations WHERE name = '$$name'" | grep -q 1; then
            echo "skipping $$name (already applied)"
          else
            echo "applying $$name"
            psql -v ON_ERROR_STOP=1 -f "$$f"
            psql -v ON_ERROR_STOP=1 -c "INSERT INTO schema_migrations (name) VALUES ('$$name')"
          fi
        done
        echo "migrations complete"
    networks: [internal]

  control-plane:
    build:
      context: ..
      dockerfile: packaging/docker/control-plane/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://sidey@postgres:5432/sidey
      DB_PASSWORD_FILE: /run/secrets/db_password
      SIDEY_ADMIN_API_KEY: ${SIDEY_ADMIN_API_KEY:-}
      SCHEDULER_INTERVAL_SECONDS: "300"
      REFRESH_LEAD_DAYS: "2"
      ARTIFACT_DIR: /var/lib/sidey/artifacts
    volumes:
      - sidey-artifacts:/var/lib/sidey/artifacts
    secrets:
      - session_signing_key
      - db_password
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  signing-worker:
    build:
      context: ..
      dockerfile: packaging/docker/signing-worker/Dockerfile
    restart: unless-stopped
    # Host networking: the worker signs via Apple/anisette services that live
    # on the host loopback (omnisette on 127.0.0.1:6970, control-plane on
    # 127.0.0.1:8080), exactly like the refresh agent on the host.
    network_mode: host
    environment:
      PORT: "8090"
      SIDEY_CONTROL_PLANE_URL: http://127.0.0.1:8080
      SIDEY_ANISETTE_URL: http://127.0.0.1:6970
      SIDEY_AGENT_STATE_DIR: /var/lib/sidey/signing-worker
      SIDEY_STATE_RUNTIME_DIR: /run/sidey/signing-state
      SIDEY_ENROLMENT_TOKEN: ${SIDEY_SIGNING_WORKER_TOKEN:-}
      SIDEY_IMPORT_STATE_DIR: ${SIDEY_SIGNING_IMPORT_DIR:-}
      SIDEY_2FA_CODE_FILE: /2fa/2fa-code.txt
    volumes:
      - sidey-signing-state:/var/lib/sidey/signing-worker
      - /var/lib/sidey/2fa:/2fa
    secrets:
      - apple_credential_key
      - apple_credentials
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
  sidey-artifacts:
  sidey-signing-state:

secrets:
  db_password:
    file: ./secrets/db_password
  session_signing_key:
    file: ./secrets/session_signing_key
  apple_credential_key:
    file: ./secrets/apple_credential_key
  apple_credentials:
    file: ./secrets/apple_credentials

networks:
  internal: {}
