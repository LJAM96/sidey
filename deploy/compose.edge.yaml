# Local edge overlay: device agent + tailscale.
# Usage: docker compose -f compose.yaml -f compose.edge.yaml up -d
name: sidey

services:
  device-agent:
    build:
      context: ..
      dockerfile: packaging/docker/device-agent/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8091"
      RUST_LOG: info
    # Only the edge host receives these privileges (plan: "Docker design").
    volumes:
      - /var/run/usbmuxd:/var/run/usbmuxd
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon:/var/run/avahi-daemon
      - pairing-vault:/var/lib/sidey/pairing
    devices:
      - /dev/bus/usb:/dev/bus/usb
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8091/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    # For tvOS discovery, host networking may be preferable to routed bridge
    # networking. Selected after testing (plan: "Initial edge services"),
    # not assumed.

  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    hostname: sidey-edge
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
    volumes:
      - ts-state:/var/lib/tailscale
    networks: [internal]

  # VirtualHere client (D13): makes the USB device plugged into a VirtualHere
  # server at home appear as a local USB port, so usbmuxd on this host can
  # pair the phone. Privileged: loads the host's vhci-hcd module and creates
  # ports under /dev/bus/usb. Host prerequisites: usbmuxd installed and
  # running on this host (apt install usbmuxd), modprobe vhci-hcd. Traffic
  # stays on the tailnet. Proprietary software; see packaging/docker/README.md.
  virtualhere-client:
    build:
      context: ..
      dockerfile: packaging/docker/virtualhere-client/Dockerfile
    restart: unless-stopped
    privileged: true
    environment:
      # Tailscale host:port of the home VirtualHere server, e.g. 100.64.0.5:7575.
      # Leave unset to rely on autodiscovery only.
      VH_SERVER: ${VH_SERVER:-}
    volumes:
      - vh-client-state:/root
    networks: [internal]

volumes:
  pairing-vault:
  ts-state:
  vh-client-state:
