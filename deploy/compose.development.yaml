# Development overlay: expose ports, local-only conveniences.
# Usage (development includes the USB device, so the device service is
# part of the dev stack either in default mode or via compose.edge.yaml):
#   docker compose -f compose.yaml -f compose.development.yaml up -d
#   docker compose -f compose.yaml -f compose.edge.yaml -f compose.development.yaml up -d
name: sidey

services:
  postgres:
    ports:
      - "5432:5432"

  control-plane:
    ports:
      - "8080:8080"

  signing-worker:
    ports:
      - "8090:8090"

  device-service:
    ports:
      - "8091:8091"
